[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "video-workflow"
version = "0.1.0"
description = "LLM-agent pipeline that writes short-form videos, renders them with Higgsfield (via MCP), and publishes them to YouTube Shorts, Instagram Reels and TikTok."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.8"]
openai = ["openai>=1.66"]
gemini = ["google-genai>=1.0"]
mcp = ["mcp>=2.0"]
cloud = ["psycopg[binary]>=3.2"]
all = [
  "anthropic>=2.8",
  "openai>=1.66",
  "google-genai>=1.0",
  "mcp>=2.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
vw = "video_workflow.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/video_workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
